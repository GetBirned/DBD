<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Hero marks. These are referenced from JSX/inline CSS mask-image, so the preload
         scanner can't discover them until React has rendered (~1.5s in, measured). All
         three sit above the fold on every page — one as the 3D hero, the other two as the
         nav icons beside it — so none of these preloads go unused. -->
    <link rel="preload" as="image" href="/logos/DB_black.svg" fetchpriority="high" />
    <link rel="preload" as="image" href="/logos/DBD.svg" />
    <link rel="preload" as="image" href="/logos/codeSymbol.webp" />
    <title>Dart Birnie @ Designs By Dart</title>
    <meta name="description" content="Software engineer and freelance web designer. Trimble, Designs By Dart, and side projects." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dartbirnie.dev/" />
    <meta property="og:title" content="Dart Birnie @ Designs By Dart" />
    <meta property="og:description" content="Software engineer and freelance web designer. Trimble, Designs By Dart, and side projects." />
    <meta property="og:image" content="https://dartbirnie.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dart Birnie @ Designs By Dart" />
    <meta name="twitter:description" content="Software engineer and freelance web designer. Trimble, Designs By Dart, and side projects." />
    <meta name="twitter:image" content="https://dartbirnie.dev/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
